name: Deploy Over-The-Air Update

on:
    push:
        branches:
            - main
    pull_request:
        branches: [main]

permissions:
    contents: read

jobs:
    update:
        runs-on: ubuntu-latest
        steps:
            - name: 🏗 Checkout repository
              uses: actions/checkout@v4

            - name: 🏗 Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: 'npm'

            - name: 📦 Install dependencies
              run: npm ci

            - name: 🚀 Setup EAS CLI
              uses: expo/expo-github-action@v8
              with:
                  eas-version: latest
                  token: ${{ secrets.EXPO_TOKEN }}

            - name: 🚀 Publish OTA Update
              env:
                  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
                  EXPO_PUBLIC_SUPABASE_URL: 'https://latvgcqifuzshqqztlti.supabase.co'
                  EXPO_PUBLIC_SUPABASE_ANON_KEY: 'sb_publishable_EYFTE-MzwQSTNzixLEZzJQ_oBuDQ7r8'
              run: eas update --channel preview
